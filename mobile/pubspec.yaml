name: pulseos_mobile
description: Android-only PulseOS companion with six device-health and utility destinations.
publish_to: "none"
version: 0.2.1+2

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  archive: ^4.0.7
  battery_plus: ^6.2.3
  cupertino_icons: ^1.0.8
  file_picker: ^10.3.3
  image: ^4.5.4
  path_provider: ^2.1.5
  pdf: ^3.11.3
  shared_preferences: ^2.5.3
  video_player: ^2.9.5
  sqflite: ^2.3.3+1
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2

flutter:
  uses-material-design: true
  assets:
    - web/icons/Icon-maskable-512.png
    - assets/PulseOS_animation.mp4
