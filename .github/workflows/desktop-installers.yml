name: Build desktop installers

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  package:
    name: Package ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: macos-14
            artifact: PulseOS-macos-apple-silicon
            file: desktop/target/installer/*.dmg
          - os: macos-13
            artifact: PulseOS-macos-intel
            file: desktop/target/installer/*.dmg
          - os: windows-2022
            artifact: PulseOS-windows
            file: desktop/target/installer/*.exe
          - os: ubuntu-22.04
            artifact: PulseOS-linux
            file: desktop/target/installer/*.deb
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build installer
        shell: bash
        run: |
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            powershell -ExecutionPolicy Bypass -File scripts/package_windows.ps1
          elif [[ "${{ runner.os }}" == "Linux" ]]; then
            bash scripts/package_linux.sh
          else
            bash scripts/package_mac.sh
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.file }}
